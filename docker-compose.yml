services:
  multi-uno:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multi-uno
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "127.0.0.1:${HOST_PORT:-3150}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
